name: CI (socket.io-client))

on:
  push:
    branches:
      - '**'
    paths:
      - 'packages/engine.io/**'
      - 'packages/engine.io-client/**'
      - 'packages/engine.io-parser/**'
      - 'packages/socket.io/**'
      - 'packages/socket.io-adapter/**'
      - 'packages/socket.io-client/**'
      - 'packages/socket.io-component-emitter/**'
      - 'packages/socket.io-parser/**'
      - 'examples/typescript-check-public-exports/**'
      - '.github/workflows/ci-socket.io-client.yml'
  pull_request:
    paths:
      - 'packages/engine.io/**'
      - 'packages/engine.io-client/**'
      - 'packages/engine.io-parser/**'
      - 'packages/socket.io/**'
      - 'packages/socket.io-adapter/**'
      - 'packages/socket.io-client/**'
      - 'packages/socket.io-component-emitter/**'
      - 'packages/socket.io-parser/**'
      - 'examples/typescript-check-public-exports/**'
      - '.github/workflows/ci-socket.io-client.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile dependencies
        run: |
          npm run compile \
            --workspace=engine.io-parser \
            --workspace=engine.io-client \
            --workspace=socket.io-parser

      - name: Compile package
        run: npm run compile --workspace=socket.io-client

      - name: Check public type declarations
        run: npm run test:types --workspace=socket.io-client

      - name: Compile dev dependencies
        run: |
          npm run compile \
            --workspace=engine.io \
            --workspace=socket.io-adapter \
            --workspace=socket.io

      - name: Run tests
        run: npm test --workspace=socket.io-client

      - name: Check browser test credentials
        if: github.event_name == 'push'
        id: browser-tests
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          if [ -n "$SAUCE_USERNAME" ] && [ -n "$SAUCE_ACCESS_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Sauce Labs browser tests: credentials are not configured."
            echo "Browser tests skipped because Sauce Labs credentials are not configured. Browser coverage has not been verified." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run browser tests
        if: github.event_name == 'push' && steps.browser-tests.outputs.enabled == 'true'
        run: npm test --workspace=socket.io-client
        env:
          BROWSERS: 1
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
