name: Build examples

on:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  build-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        example:
          # - custom-parsers
          - typescript-example/cjs
          # - typescript-example/esm TODO enable once https://github.com/socketio/socket.io/commit/74599a6b9e3dbeff1a9efe46c305d5d25d6e3dd8 is released
          - typescript-client-example/cjs
          - typescript-client-example/esm
          - webpack-build
          - webpack-build-server
          - basic-crud-application/angular-client
          - basic-crud-application/vue-client
          - nextjs-pages-router
          - nextjs-app-router
          # - nuxt-example
          # - typescript-check-public-exports TODO enable once https://github.com/socketio/socket.io/pull/5533 is fixed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Build ${{ matrix.example }}
        run: |
          cd examples/${{ matrix.example }}
          npm install
          npm run build
